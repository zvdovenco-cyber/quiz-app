<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат теста</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            color: #111827;
        }

        .student-name {
            font-size: 1.05rem;
            color: #6b7280;
            margin-bottom: 24px;
        }

            .student-name strong {
                color: #1f2937;
            }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #f9fafb;
            border: 4px solid #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.3rem;
            font-weight: 700;
            margin: 0 auto 20px;
            color: #2563eb;
        }

        .details {
            font-size: 1.1rem;
            color: #374151;
            margin-bottom: 20px;
        }

            .details strong {
                color: #2563eb;
                font-size: 1.2rem;
            }

        .info-box {
            background: #f9fafb;
            border-radius: 10px;
            padding: 14px;
            font-size: 0.9rem;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 16px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Тест завершен!</h1>
        <div class="student-name">Ученик: <strong>{{ student_name }}</strong></div>

        <div class="score-circle">
            {{ score }}%
        </div>

        <div class="details">
            Правильных ответов: <strong>{{ correct_count }}</strong> из <strong>{{ total }}</strong>
        </div>

        <div class="info-box">
            Ваши результаты сохранены в системе преподавателя.
        </div>
    </div>
</body>
</html>
