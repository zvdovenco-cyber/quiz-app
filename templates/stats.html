<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результаты студентов</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Результаты студентов</h1>
            <a href="/" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition">
                На главную
            </a>
        </div>

        {% if results %}
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
                        <th class="p-3">Студент</th>
                        <th class="p-3">Баллы</th>
                        <th class="p-3">Процент</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 text-sm">
                    {% for r in results %}
                    <tr>
                        <td class="p-3 font-medium text-gray-900">{{ r.student_name }}</td>
                        <td class="p-3 text-gray-700">{{ r.correct_count }} / {{ r.total_questions }}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs font-bold {% if r.score >= 70 %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
                                {{ r.score }}%
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p class="text-gray-500 text-center py-6">Студенты еще не проходили этот тест.</p>
        {% endif %}
    </div>
</body>
</html>
