<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Вход для преподавателя</h1>

        {% if error %}
        <div class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Логин:</label>
                <input type="text" name="username" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль:</label>
                <input type="password" name="password" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
                Войти
            </button>
        </form>

        <p class="text-xs text-center text-gray-500 mt-4">
            Нет аккаунта? <a href="/register" class="text-blue-600 font-semibold underline">Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>
