<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кабинет преподавателя</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Шапка -->
        <div class="bg-white p-4 rounded-xl shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Преподаватель: <span class="text-blue-600">{{ user }}</span></h1>
            <a href="/logout" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 font-semibold px-3 py-2 rounded-lg transition">
                Выйти
            </a>
        </div>

        <!-- Форма генерации -->
        <div class="bg-white p-8 rounded-xl shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Создать новый тест</h2>

            {% if error %}
            <div class="mb-4 p-4 bg-red-100 text-red-700 rounded-lg text-sm">
                ❌ {{ error }}
            </div>
            {% endif %}

            <form action="/generate-test" method="POST" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Количество вопросов:</label>
                        <select name="num_questions" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="3" selected>3 вопроса</option>
                            <option value="5">5 вопросов</option>
                            <option value="10">10 вопросов</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Уровень сложности:</label>
                        <select name="difficulty" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="легкий">Легкий</option>
                            <option value="средний" selected>Средний</option>
                            <option value="сложный">Сложный</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Текст конспекта:</label>
                    <textarea name="text" rows="5" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Вставьте лекцию..."></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition shadow-md">
                    Сгенерировать тест
                </button>
            </form>
        </div>

        <!-- История созданных тестов -->
        <div class="bg-white p-8 rounded-xl shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Мои созданные тесты</h2>
            {% if my_tests %}
            <div class="space-y-3">
                {% for t in my_tests %}
                <div class="p-4 border rounded-lg flex justify-between items-center hover:bg-gray-50 transition">
                    <div>
                        <span class="text-xs font-bold text-gray-400">ID: {{ t.id }}</span>
                        <p class="text-sm font-medium text-gray-800">Вопросов: {{ t.questions_count }}</p>
                    </div>
                    <div class="flex space-x-2">
                        <a href="/quiz/{{ t.id }}" target="_blank" class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 font-semibold px-3 py-2 rounded transition">
                            Пройти
                        </a>
                        <a href="/stats/{{ t.id }}" class="text-xs bg-gray-100 text-gray-700 hover:bg-gray-200 font-semibold px-3 py-2 rounded transition">
                            Статистика
                        </a>
                    </div>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <p class="text-sm text-gray-500">Вы еще не создавали тестов.</p>
            {% endif %}
        </div>

    </div>
</body>
</html>
