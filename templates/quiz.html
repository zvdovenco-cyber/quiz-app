<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прохождение теста</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Тестирование</h1>

        <form action="/submit-quiz/{{ test_id }}" method="POST" class="space-y-6">
            <!-- Поле для имени студента -->
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
                <label class="block text-sm font-semibold text-blue-900 mb-1">
                    Ваше ФИО / Имя:
                </label>
                <input type="text" name="student_name" required placeholder="Иван Иванов"
                       class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            {% for q in questions %}
            <div class="border border-gray-200 rounded-lg p-5 bg-gray-50">
                <h3 class="font-semibold text-lg text-gray-900 mb-3">
                    {{ loop.index }}. {{ q.question }}
                </h3>

                <div class="space-y-2">
                    {% for option in q.options %}
                    <label class="flex items-center space-x-3 p-3 rounded-lg border bg-white hover:bg-gray-100 cursor-pointer transition">
                        <input type="radio" name="question_{{ q.id }}" value="{{ option }}" required class="h-4 w-4 text-blue-600">
                        <span class="text-gray-700 text-sm">{{ option }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition shadow-md">
                Отправить ответы
            </button>
        </form>
    </div>
</body>
</html>
